[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oceanmaster"
version = "2.0.0"
description = "Ocean Analysis Platform with LLM-powered Agent"
requires-python = ">=3.10"
dependencies = [
    # Web框架
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "sse-starlette>=1.8.2",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # 异步任务
    "celery>=5.3.4",
    "redis>=5.0.1",

    # LLM客户端
    "anthropic>=0.7.7",
    "openai>=1.6.1",

    # 数据科学
    "xarray>=2023.11.0",
    "numpy>=1.24.3",
    "pandas>=2.1.3",
    "scipy>=1.11.4",
    "netCDF4>=1.6.5",
    "gsw>=3.6.19",

    # 可视化
    "matplotlib>=3.8.2",
    "cartopy>=0.22.0",

    # 工具
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "aiofiles>=23.2.1",
    "httpx>=0.25.2",
    "reportlab>=4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "black>=23.11.0",
    "ruff>=0.1.6",
    "mypy>=1.7.0",
]
zarr = [
    "dask[array]>=2024.1.0",
    "zarr>=2.16,<3",
    "numcodecs>=0.12.1",
]

[tool.setuptools.packages.find]
include = ["domain*", "packages*"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
